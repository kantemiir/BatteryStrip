ShortDescription: Battery charge of wireless mice, headsets and controllers on the Windows 11 taskbar.
Description: >-
  A tiny strip on the Windows 11 taskbar, next to the clock, that shows the charge of wireless devices: COMPX mice
  (Lamzu, Ajazz, Attack Shark), Logitech HID++ devices and the G435, Bluetooth devices, DualSense, DualShock 4 and Xbox
  controllers. Colour warnings at 20% and 10%, notifications, light and dark theme. No administrator rights, no telemetry.
